<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1,
               maximum-scale=1,
               user-scalable=no">

<title>R60 Browser</title>

<style>

/* =====================================================
   R60 BROWSER
   Opera Mini / J2ME inspired
   Lightweight single-file browser UI
===================================================== */

:root{
  --bg:#070b10;
  --bar:#111820;
  --bar2:#18222e;
  --panel:#121a23;
  --panel2:#1b2734;
  --line:#2d3b4c;
  --text:#ffffff;
  --muted:#8d9bad;

  --blue:#2490ff;
  --blue2:#0e61bc;
  --green:#19a875;
  --purple:#7850d9;
  --orange:#c17a19;
  --red:#b83d4d;

  --focus:#28a8ff;
}

/* =========================
   RESET
========================= */

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,
body{
  width:100%;
  height:100%;
  margin:0;
  padding:0;

  overflow:hidden;

  background:var(--bg);
  color:var(--text);

  font-family:
    Arial,
    Helvetica,
    sans-serif;
}

body{
  user-select:none;
}

button,
input{
  font-family:inherit;
}

/* =========================
   APP
========================= */

#app{
  width:100%;
  height:100%;

  display:flex;
  flex-direction:column;
}

/* =========================
   TOP BAR
========================= */

.topbar{
  background:
    linear-gradient(
      180deg,
      #1b2530,
      #0e151d
    );

  border-bottom:
    1px solid var(--line);

  padding:5px;

  box-shadow:
    0 2px 12px rgba(0,0,0,.45);

  z-index:50;
}

/* =========================
   ADDRESS
========================= */

.address-row{
  display:flex;
  gap:5px;
}

#address{
  flex:1;

  min-width:0;

  height:38px;

  background:#070b10;

  color:white;

  border:
    1px solid #344456;

  border-radius:9px;

  outline:none;

  padding:
    0 10px;

  font-size:13px;
}

#address:focus{
  border-color:var(--blue);

  box-shadow:
    0 0 0 2px
    rgba(36,144,255,.18);
}

#go{
  width:50px;

  border:0;

  border-radius:9px;

  color:white;

  font-weight:bold;

  background:
    linear-gradient(
      180deg,
      #3498ff,
      #1266c5
    );
}

/* =========================
   NAV BUTTONS
========================= */

.nav-row{
  display:grid;

  grid-template-columns:
    repeat(7,1fr);

  gap:4px;

  margin-top:5px;
}

.nav-button{
  height:32px;

  border:
    1px solid #2d3d4e;

  border-radius:8px;

  color:#eaf2fb;

  background:
    linear-gradient(
      180deg,
      #202c39,
      #151e28
    );

  display:flex;

  justify-content:center;

  align-items:center;

  font-size:15px;

  transition:
    transform .06s;
}

.nav-button:active{
  transform:scale(.91);
}

/* =========================
   MODE BAR
========================= */

.mode-row{
  display:grid;

  grid-template-columns:
    1fr 1fr 1fr;

  gap:4px;

  margin-top:5px;
}

.mode-button{
  height:31px;

  border-radius:8px;

  color:white;

  border:
    1px solid rgba(255,255,255,.12);

  font-size:10px;

  font-weight:bold;
}

.desktop{
  background:
    linear-gradient(
      180deg,
      #8c5af0,
      #5b34ad
    );
}

.mobile{
  background:
    linear-gradient(
      180deg,
      #1bbd82,
      #08764d
    );
}

.external{
  background:
    linear-gradient(
      180deg,
      #d9952c,
      #92590d
    );
}

.mode-active{
  box-shadow:
    inset 0 0 0 2px white,
    0 0 9px
    rgba(255,255,255,.13);
}

/* =========================
   WEB AREA
========================= */

#web-area{
  position:relative;

  flex:1;

  overflow:hidden;

  background:#05080c;
}

/* =========================
   HOME
========================= */

#home{
  position:absolute;

  inset:0;

  overflow:auto;

  padding:
    18px 12px;
}

.logo{
  text-align:center;

  font-size:28px;

  font-weight:900;

  margin-top:20px;

  letter-spacing:.5px;

  background:
    linear-gradient(
      90deg,
      #55aaff,
      #b57bff
    );

  -webkit-background-clip:text;

  color:transparent;
}

.subtitle{
  text-align:center;

  color:var(--muted);

  font-size:10px;

  margin-top:4px;
}

/* =========================
   HOME SEARCH
========================= */

.home-search{
  margin-top:20px;

  display:flex;

  gap:5px;
}

#home-search{
  flex:1;

  height:38px;

  border-radius:9px;

  border:
    1px solid #334357;

  background:#0a0f15;

  color:white;

  padding:
    0 10px;

  outline:none;
}

.home-search button{
  width:48px;

  border:0;

  border-radius:9px;

  background:var(--blue);

  color:white;
}

/* =========================
   QUICK SITES
========================= */

.section-title{
  margin-top:20px;

  font-size:10px;

  color:#9caabd;

  font-weight:bold;

  letter-spacing:1px;
}

.quick-sites{
  display:grid;

  grid-template-columns:
    repeat(3,1fr);

  gap:6px;

  margin-top:6px;
}

.quick-site{
  height:48px;

  border:
    1px solid #2a394a;

  border-radius:9px;

  color:white;

  background:
    linear-gradient(
      180deg,
      #1c2836,
      #131c26
    );

  font-size:10px;

  font-weight:bold;
}

/* =========================
   WEB FRAME
========================= */

#web{
  position:absolute;

  left:0;
  top:0;

  width:100%;
  height:100%;

  border:0;

  background:white;

  display:none;
}

/* =========================
   DESKTOP VIEW
========================= */

.desktop-canvas{
  width:1366px !important;

  height:100% !important;

  transform-origin:
    top left;
}

/* =========================
   SMART POINTER
========================= */

/*
  Real mouse-pointer shape.
  NOT a circle.
*/

#pointer{
  position:absolute;

  left:20px;
  top:20px;

  width:22px;
  height:30px;

  z-index:100;

  display:none;

  pointer-events:none;

  transform:
    translate(-1px,-1px);
}

/* SVG itself */
#pointer svg{
  width:100%;
  height:100%;

  overflow:visible;

  filter:
    drop-shadow(
      1px 2px 2px
      rgba(0,0,0,.75)
    );
}

/* =========================
   CLICKABLE FOCUS RING
========================= */

#focus-ring{
  position:absolute;

  z-index:90;

  display:none;

  pointer-events:none;

  border-radius:6px;

  border:
    2px solid var(--focus);

  background:
    rgba(36,144,255,.10);

  box-shadow:
    0 0 0 2px
      rgba(0,0,0,.35),
    0 0 12px
      rgba(36,144,255,.45);

  transition:
    left .035s linear,
    top .035s linear,
    width .035s linear,
    height .035s linear;
}

/*
  Four-corner brackets
*/

#focus-ring::before,
#focus-ring::after{
  content:"";

  position:absolute;

  width:7px;
  height:7px;

  border-color:#69c0ff;

  border-style:solid;
}

#focus-ring::before{
  left:-3px;
  top:-3px;

  border-width:
    2px 0 0 2px;
}

#focus-ring::after{
  right:-3px;
  bottom:-3px;

  border-width:
    0 2px 2px 0;
}

/* =========================
   CLICK FLASH
========================= */

.click-effect{
  animation:
    pointerClick .16s ease;
}

@keyframes pointerClick{

  0%{
    opacity:1;
  }

  50%{
    opacity:.45;
  }

  100%{
    opacity:1;
  }
}

/* =========================
   POINTER INFO
========================= */

#pointer-status{
  position:absolute;

  right:6px;
  bottom:6px;

  z-index:110;

  background:
    rgba(0,0,0,.78);

  border:
    1px solid #435365;

  color:#bcd0e5;

  padding:
    5px 8px;

  border-radius:14px;

  font-size:9px;

  display:none;
}

/* =========================
   TOAST
========================= */

#toast{
  position:absolute;

  left:50%;
  bottom:13px;

  transform:
    translateX(-50%);

  z-index:300;

  padding:
    7px 12px;

  background:
    rgba(0,0,0,.88);

  border:
    1px solid #47586c;

  border-radius:18px;

  font-size:10px;

  white-space:nowrap;

  display:none;
}

/* =========================
   PANEL
========================= */

#panel{
  position:absolute;

  left:5px;
  right:5px;
  bottom:5px;

  z-index:250;

  max-height:82%;

  overflow:auto;

  display:none;

  padding:8px;

  background:
    linear-gradient(
      180deg,
      #17212d,
      #0e151d
    );

  border:
    1px solid #3c4c60;

  border-radius:12px;

  box-shadow:
    0 15px 40px
    rgba(0,0,0,.85);
}

.panel-head{
  display:flex;

  align-items:center;

  justify-content:space-between;

  padding:
    3px 4px 8px;

  border-bottom:
    1px solid var(--line);

  font-weight:bold;

  font-size:13px;
}

.panel-item{
  display:flex;

  gap:5px;

  margin-top:5px;
}

.panel-item button{
  flex:1;

  min-height:37px;

  border-radius:8px;

  color:white;

  background:#1d2a38;

  border:
    1px solid #304153;

  text-align:left;

  padding:
    0 9px;
}

.close{
  background:
    var(--red)!important;

  text-align:center!important;
}

/* =========================
   BOTTOM
========================= */

.bottom{
  display:grid;

  grid-template-columns:
    repeat(5,1fr);

  gap:4px;

  padding:5px;

  background:
    #111820;

  border-top:
    1px solid var(--line);
}

.bottom button{
  height:32px;

  border-radius:8px;

  border:
    1px solid #2b3b4d;

  background:
    linear-gradient(
      180deg,
      #1d2936,
      #151e27
    );

  color:#dbe7f4;

  font-size:10px;

  font-weight:bold;
}

/* =========================
   TYPING MODE
========================= */

.typing{
  border-color:
    #36a7ff!important;

  box-shadow:
    0 0 0 2px
    rgba(36,144,255,.2);
}

</style>
</head>


<body>

<div id="app">

  <!-- =====================================
       TOP
  ====================================== -->

  <div class="topbar">

    <div class="address-row">

      <input
        id="address"
        type="text"
        autocomplete="off"
        spellcheck="false"
        inputmode="url"
        placeholder="Search or enter URL">

      <button
        id="go"
        onclick="navigate()">
        GO
      </button>

    </div>


    <div class="nav-row">

      <button
        class="nav-button"
        onclick="goBack()">
        <!-- back -->
        <svg width="17" height="17"
             viewBox="0 0 24 24"
             fill="none"
             stroke="currentColor"
             stroke-width="2">
          <path d="M19 12H5"/>
          <path d="M12 19l-7-7 7-7"/>
        </svg>
      </button>


      <button
        class="nav-button"
        onclick="goForward()">

        <svg width="17" height="17"
             viewBox="0 0 24 24"
             fill="none"
             stroke="currentColor"
             stroke-width="2">
          <path d="M5 12h14"/>
          <path d="M12 5l7 7-7 7"/>
        </svg>

      </button>


      <button
        class="nav-button"
        onclick="reloadPage()">

        <svg width="17" height="17"
             viewBox="0 0 24 24"
             fill="none"
             stroke="currentColor"
             stroke-width="2">
          <path d="M20 11a8 8 0 1 0 2 5"/>
          <path d="M20 4v7h-7"/>
        </svg>

      </button>


      <button
        class="nav-button"
        onclick="goHome()">

        <svg width="17" height="17"
             viewBox="0 0 24 24"
             fill="none"
             stroke="currentColor"
             stroke-width="2">
          <path d="M3 11l9-8 9 8"/>
          <path d="M5 10v10h14V10"/>
          <path d="M9 20v-6h6v6"/>
        </svg>

      </button>


      <button
        class="nav-button"
        onclick="newTab()">

        <svg width="17" height="17"
             viewBox="0 0 24 24"
             fill="none"
             stroke="currentColor"
             stroke-width="2">
          <path d="M12 5v14"/>
          <path d="M5 12h14"/>
        </svg>

      </button>


      <button
        class="nav-button"
        onclick="saveBookmark()">

        <svg width="17" height="17"
             viewBox="0 0 24 24"
             fill="none"
             stroke="currentColor"
             stroke-width="2">
          <path d="M6 4h12v17l-6-4-6 4z"/>
        </svg>

      </button>


      <button
        class="nav-button"
        onclick="openTools()">

        <svg width="17" height="17"
             viewBox="0 0 24 24"
             fill="none"
             stroke="currentColor"
             stroke-width="2">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.8 1.8 0 0 0 .36 2l.06.06-1.42 1.42-.06-.06a1.8 1.8 0 0 0-2-.36 1.8 1.8 0 0 0-1.1 1.65V20h-2v-.29A1.8 1.8 0 0 0 12.15 18a1.8 1.8 0 0 0-2 .36l-.06.06-1.42-1.42.06-.06a1.8 1.8 0 0 0 .36-2A1.8 1.8 0 0 0 7.44 14H7v-2h.44a1.8 1.8 0 0 0 1.65-1.1 1.8 1.8 0 0 0-.36-2l-.06-.06 1.42-1.42.06.06a1.8 1.8 0 0 0 2 .36A1.8 1.8 0 0 0 13.25 6V5h2v1a1.8 1.8 0 0 0 1.1 1.65 1.8 1.8 0 0 0 2-.36l.06-.06 1.42 1.42-.06.06a1.8 1.8 0 0 0-.36 2A1.8 1.8 0 0 0 21 12h.5v2h-.5a1.8 1.8 0 0 0-1.6 1z"/>
        </svg>

      </button>

    </div>


    <div class="mode-row">

      <button
        id="desktop-btn"
        class="mode-button desktop"
        onclick="setDesktop()">
        DESKTOP
      </button>

      <button
        id="mobile-btn"
        class="mode-button mobile"
        onclick="setMobile()">
        MOBILE
      </button>

      <button
        class="mode-button external"
        onclick="openExternal()">
        BROWSER
      </button>

    </div>

  </div>


  <!-- =====================================
       WEB AREA
  ====================================== -->

  <div id="web-area">


    <!-- HOME -->

    <div id="home">

      <div class="logo">
        R60 Browser
      </div>

      <div class="subtitle">
        Opera Mini inspired • Keypad optimized
      </div>


      <div class="home-search">

        <input
          id="home-search"
          placeholder="Search Google">

        <button
          onclick="homeSearch()">

          <svg width="17"
               height="17"
               viewBox="0 0 24 24"
               fill="none"
               stroke="currentColor"
               stroke-width="2">
            <circle cx="11" cy="11" r="7"/>
            <path d="M20 20l-4-4"/>
          </svg>

        </button>

      </div>


      <div class="section-title">
        QUICK ACCESS
      </div>


      <div class="quick-sites">

        <button
          onclick="quick('https://www.google.com')">
          Google
        </button>

        <button
          onclick="quick('https://www.youtube.com')">
          YouTube
        </button>

        <button
          onclick="quick('https://web.imo.im')">
          imo
        </button>

        <button
          onclick="quick('https://www.facebook.com')">
          Facebook
        </button>

        <button
          onclick="quick('https://github.com')">
          GitHub
        </button>

        <button
          onclick="quick('https://wikipedia.org')">
          Wikipedia
        </button>

      </div>

    </div>


    <!-- WEB PAGE -->

    <iframe
      id="web"
      allow="
        fullscreen;
        autoplay;
        microphone;
        camera
      "
      referrerpolicy=
      "strict-origin-when-cross-origin">
    </iframe>


    <!-- =====================================
         REAL POINTER
    ====================================== -->

    <div id="pointer">

      <svg
        viewBox="0 0 24 32"
        xmlns="http://www.w3.org/2000/svg">

        <!-- black outline -->
        <path
          d="
          M2 1
          L21 18
          L14 18
          L18 29
          L14 31
          L9 20
          L4 25
          Z"
          fill="#000"
          stroke="#000"
          stroke-width="2"/>

        <!-- white inside -->
        <path
          d="
          M4 4
          L18 17
          L12 17
          L16 28
          L14 29
          L9 18
          L5 22
          Z"
          fill="#fff"/>

      </svg>

    </div>


    <!-- CLICKABLE FOCUS -->

    <div id="focus-ring"></div>


    <!-- POINTER STATUS -->

    <div id="pointer-status">
      POINTER
    </div>


    <!-- TOAST -->

    <div id="toast"></div>


    <!-- TOOLS PANEL -->

    <div id="panel"></div>

  </div>


  <!-- =====================================
       BOTTOM
  ====================================== -->

  <div class="bottom">

    <button onclick="changeZoom(-1)">
      − ZOOM
    </button>

    <button onclick="resetZoom()">
      100%
    </button>

    <button onclick="changeZoom(1)">
      + ZOOM
    </button>

    <button onclick="fullScreen()">
      FULL
    </button>

    <button onclick="openTools()">
      TOOLS
    </button>

  </div>

</div>


<script>

/* =====================================================
   STATE
===================================================== */

let mode =
  localStorage.getItem("r60_mode")
  || "desktop";

let zoomLevel =
  Number(
    localStorage.getItem("r60_zoom")
    || 1
  );

let pointerX = 60;
let pointerY = 80;

/*
  High speed pointer.
  Increase to 55/70 if necessary.
*/

let pointerSpeed = 42;

let pointerVisible = false;

let typingMode = false;

let bookmarks =
  JSON.parse(
    localStorage.getItem(
      "r60_bookmarks"
    ) || "[]"
  );

let historyList =
  JSON.parse(
    localStorage.getItem(
      "r60_history"
    ) || "[]"
  );


/* =====================================================
   ELEMENTS
===================================================== */

const address =
  document.getElementById(
    "address"
  );

const home =
  document.getElementById(
    "home"
  );

const homeSearchInput =
  document.getElementById(
    "home-search"
  );

const web =
  document.getElementById(
    "web"
  );

const pointer =
  document.getElementById(
    "pointer"
  );

const focusRing =
  document.getElementById(
    "focus-ring"
  );

const webArea =
  document.getElementById(
    "web-area"
  );

const toast =
  document.getElementById(
    "toast"
  );

const panel =
  document.getElementById(
    "panel"
  );


/* =====================================================
   URL DETECTION
===================================================== */

function isURL(text){

  return (
    /^https?:\/\//i.test(text)
    ||
    /^[a-z0-9-]+\.[a-z]{2,}/i
      .test(text)
  );

}


function normalizeURL(text){

  text =
    text.trim();

  if(
    /^https?:\/\//i.test(text)
  ){
    return text;
  }

  return "https://" + text;

}


/* =====================================================
   NAVIGATION
===================================================== */

function navigate(){

  const value =
    address.value.trim();

  if(!value)
    return;


  if(isURL(value)){

    loadURL(
      normalizeURL(value)
    );

  }else{

    searchGoogle(value);

  }

}


function searchGoogle(query){

  const url =
    "https://www.google.com/search?q="
    +
    encodeURIComponent(query);

  address.value =
    url;

  loadURL(url);

}


function homeSearch(){

  const value =
    homeSearchInput.value.trim();

  if(!value)
    return;

  address.value =
    value;

  searchGoogle(value);

}


/* =====================================================
   LOAD
===================================================== */

function loadURL(url){

  home.style.display =
    "none";

  web.style.display =
    "block";

  web.src =
    url;

  applyMode();

  addHistory(url);

  pointerVisible = true;

  showPointer();

  showToast(
    mode === "desktop"
      ? "Desktop mode"
      : "Mobile mode"
  );

}


/* =====================================================
   QUICK
===================================================== */

function quick(url){

  address.value =
    url;

  loadURL(url);

}


/* =====================================================
   DESKTOP
===================================================== */

function setDesktop(){

  mode =
    "desktop";

  localStorage.setItem(
    "r60_mode",
    mode
  );

  applyMode();

  showToast(
    "DESKTOP VIEW"
  );

}


/* =====================================================
   MOBILE
===================================================== */

function setMobile(){

  mode =
    "mobile";

  localStorage.setItem(
    "r60_mode",
    mode
  );

  applyMode();

  showToast(
    "MOBILE VIEW"
  );

}


/* =====================================================
   APPLY MODE
===================================================== */

function applyMode(){

  document
    .getElementById("desktop-btn")
    .classList.toggle(
      "mode-active",
      mode === "desktop"
    );

  document
    .getElementById("mobile-btn")
    .classList.toggle(
      "mode-active",
      mode === "mobile"
    );


  if(mode === "desktop"){

    web.classList.add(
      "desktop-canvas"
    );

  }else{

    web.classList.remove(
      "desktop-canvas"
    );

  }

  applyZoom();

}


/* =====================================================
   REAL BROWSER
===================================================== */

function openExternal(){

  const value =
    address.value.trim();

  if(!value){

    showToast(
      "Enter URL or search"
    );

    address.focus();

    return;

  }

  let url;

  if(isURL(value)){

    url =
      normalizeURL(value);

  }else{

    url =
      "https://www.google.com/search?q="
      +
      encodeURIComponent(value);

  }

  window.open(
    url,
    "_blank"
  );

}


/* =====================================================
   BACK
===================================================== */

function goBack(){

  try{

    web.contentWindow.history.back();

  }catch(e){

    openExternal();

  }

}


/* =====================================================
   FORWARD
===================================================== */

function goForward(){

  try{

    web.contentWindow.history.forward();

  }catch(e){

    openExternal();

  }

}


/* =====================================================
   RELOAD
===================================================== */

function reloadPage(){

    web.contentWindow.location.reload();

  }catch(e){

    web.src =
      web.src;

  }

}

   HOME
===================================================== */

  home.style.display =

   NEW TAB
===================================================== */

function newTab(){

  );

/* =====================================================
   ZOOM
===================================================== */

function changeZoom(direction){

  zoomLevel +=
    direction * .1;

  zoomLevel =
    Math.max(
      .5,
      Math.min(
        2,
        zoomLevel
      )
    );

  localStorage.setItem(
    "r60_zoom",
    zoomLevel
  );

  applyZoom();

  showToast(
    Math.round(
      zoomLevel * 100
    ) + "%"
  );

}


function resetZoom(){

  zoomLevel = 1;

  localStorage.setItem(
    "r60_zoom",
    zoomLevel
  );

  applyZoom();

}


function applyZoom(){

  web.style.transform =
    "scale("
    +
    zoomLevel
    +
    ")";

  web.style.transformOrigin =
    "top left";

  web.style.width =
    (100 / zoomLevel)
    + "%";

  web.style.height =
    (100 / zoomLevel)
    + "%";

}


/* =====================================================
   FULLSCREEN
===================================================== */

function fullScreen(){

  if(!document.fullscreenElement){

    document.documentElement
      .requestFullscreen?.();

  }else{

    document
      .exitFullscreen?.();

  }

}


/* =====================================================
   POINTER
===================================================== */

function showPointer(){

  if(!pointerVisible)
    return;

  pointer.style.display =
    "block";

  pointer.style.left =
    pointerX + "px";

  pointer.style.top =
    pointerY + "px";

}


/* =====================================================
   POINTER MOVEMENT
===================================================== */

function movePointer(dx,dy){

  /*
    Pointer moves freely inside
    viewport.

    It does NOT disappear below
    the page.
  */

  const rect =
    webArea.getBoundingClientRect();

  pointerX +=
    dx * pointerSpeed;

  pointerY +=
    dy * pointerSpeed;


  /*
    Horizontal boundary
  */

  pointerX =
    Math.max(
      0,
      Math.min(
        rect.width - 20,
        pointerX
      )
    );


  /*
    Vertical boundary
  */

  const edge = 35;


  /*
    When pointer reaches bottom:
    scroll webpage instead of
    letting pointer disappear.
  */

  if(
    dy > 0 &&
    pointerY >
      rect.height - edge
  ){

    scrollWeb(
      pointerSpeed * .75
    );

    pointerY =
      rect.height - edge;

  }


  /*
    Top edge
  */

  if(
    dy < 0 &&
    pointerY < edge
  ){

    scrollWeb(
      -pointerSpeed * .75
    );

    pointerY =
      edge;

  }


  showPointer();

  detectClickable();

}


/* =====================================================
   WEB SCROLL
===================================================== */

function scrollWeb(amount){

  try{

    web.contentWindow.scrollBy(
      0,
      amount
    );

  }catch(e){

    /*
      Cross-origin fallback:
      focus iframe so native page
      navigation can receive keys.
    */

    web.focus();

  }

}


/* =====================================================
   CLICKABLE DETECTION
===================================================== */

/*
  This works ONLY when the iframe
  document is same-origin.

  Cross-origin pages are protected
  by browser security.
*/

function detectClickable(){

  try{

    const doc =
      web.contentDocument
      ||
      web.contentWindow.document;

    if(!doc)
      return;


    const elements =
      doc.querySelectorAll(
        `
        a,
        button,
        input,
        select,
        textarea,
        video,
        [role="button"],
        [onclick],
        [tabindex]
        `
      );


    let best = null;

    let bestDistance =
      Infinity;


    const webRect =
      web.getBoundingClientRect();


    for(
      const el of elements
    ){

      const r =
        el.getBoundingClientRect();


      if(
        r.width <= 0 ||
        r.height <= 0
      )
        continue;


      /*
        Convert iframe element
        coordinates to browser
        viewport coordinates.
      */

      const x =
        webRect.left
        +
        r.left
        *
        zoomLevel;

      const y =
        webRect.top
        +
        r.top
        *
        zoomLevel;

      const w =
        r.width *
        zoomLevel;

      const h =
        r.height *
        zoomLevel;


      /*
        pointer center
      */

      const px =
        pointerX + 10;

      const py =
        pointerY + 10;


      const inside =
        px >= x &&
        px <= x+w &&
        py >= y &&
        py <= y+h;


      if(inside){

        best =
          {
            el,
            x,
            y,
            w,
            h
          };

        break;

      }


      /*
        Find nearest clickable item
      */

      const cx =
        x + w/2;

      const cy =
        y + h/2;

      const distance =
        Math.hypot(
          px-cx,
          py-cy
        );


      if(
        distance <
        bestDistance
      ){

        bestDistance =
          distance;

        /*
          Only consider nearby
          elements.
        */

        if(
          distance < 55
        ){

          best =
            {
              el,
              x,
              y,
              w,
              h
            };

        }

      }

    }


    if(best){

      focusRing.style.display =
        "block";

      focusRing.style.left =
        best.x + "px";

      focusRing.style.top =
        best.y + "px";

      focusRing.style.width =
        best.w + "px";

      focusRing.style.height =
        best.h + "px";


      pointer.dataset.target =
        "clickable";

      return;

    }


    focusRing.style.display =
      "none";

    pointer.dataset.target =
      "";

  }catch(e){

    /*
      Cross-origin:
      cannot inspect page.
    */

    focusRing.style.display =
      "none";

    pointer.dataset.target =
      "unknown";

  }

}


/* =====================================================
   SMART CLICK
===================================================== */

function smartClick(){

  /*
    If we detected a real clickable
    same-origin element:
    click that element.
  */

  if(
    pointer.dataset.target
    === "clickable"
  ){

    try{

      const doc =
        web.contentDocument
        ||
        web.contentWindow.document;


      const elements =
        doc.querySelectorAll(
          `
          a,
          button,
          input,
          select,
          textarea,
          video,
          [role="button"],
          [onclick],
          [tabindex]
          `
        );


      const webRect =
        web.getBoundingClientRect();


      const px =
        pointerX + 10;

      const py =
        pointerY + 10;


      for(
        const el of elements
      ){

        const r =
          el.getBoundingClientRect();


        const x =
          webRect.left
          +
          r.left
          *
          zoomLevel;

        const y =
          webRect.top
          +
          r.top
          *
          zoomLevel;

        const w =
          r.width *
          zoomLevel;

        const h =
          r.height *
          zoomLevel;


        if(
          px >= x &&
          px <= x+w &&
          py >= y &&
          py <= y+h
        ){

          /*
            Input field:
            enter typing mode
          */

          if(
            el.tagName ===
            "INPUT"
            ||
            el.tagName ===
            "TEXTAREA"
          ){

            el.focus();

            showToast(
              "TYPE"
            );

          }else{

            el.click();

            showToast(
              "CLICK"
            );

          }

          flashPointer();

          return;

        }

      }

    }catch(e){}

  }


  /*
    If cross-origin, we cannot know
    which element is clickable.

    Do NOT click empty page.

    Focus iframe and let its native
    keyboard/accessibility handling
    work.
  */

  if(
    pointer.dataset.target
    === "unknown"
  ){

    try{

      web.focus();

      showToast(
        "WEB CONTROL"
      );

    }catch(e){}

  }

}


/* =====================================================
   POINTER FLASH
===================================================== */

function flashPointer(){

  pointer.classList.remove(
    "click-effect"
  );

  void pointer.offsetWidth;

  pointer.classList.add(
    "click-effect"
  );

}


/* =====================================================
   KEYBOARD CONTROL
===================================================== */

document.addEventListener(
  "keydown",
  function(e){

    /*
      If user is typing into
      address box, don't move pointer.
    */

    if(
      document.activeElement ===
      address
    ){

      if(
        e.key === "Enter"
      ){

        e.preventDefault();

        navigate();

      }

      if(
        e.key === "Escape"
      ){

        address.blur();

      }

      return;

    }


    if(
      document.activeElement ===
      homeSearchInput
    ){

      if(
        e.key === "Enter"
      ){

        e.preventDefault();

        homeSearch();

      }

      if(
        e.key === "Escape"
      ){

        homeSearchInput.blur();

      }

      return;

    }


    switch(e.key){

      /* UP */

      case "ArrowUp":

        e.preventDefault();

        movePointer(
          0,
          -1
        );

        break;


      /* DOWN */

      case "ArrowDown":

        e.preventDefault();

        movePointer(
          0,
          1
        );

        break;


      /* LEFT */

      case "ArrowLeft":

        e.preventDefault();

        movePointer(
          -1,
          0
        );

        break;


      /* RIGHT */

      case "ArrowRight":

        e.preventDefault();

        movePointer(
          1,
          0
        );

        break;


      /* OK */

      case "Enter":

        e.preventDefault();

        smartClick();

        break;


      /* BACK */

      case "Escape":

        e.preventDefault();

        goBack();

        break;


      /*
        0 = fullscreen
      */

      case "0":

        fullScreen();

        break;


      /*
        * = zoom out
      */

      case "*":

        changeZoom(-1);

        break;


      /*
        # = zoom in
      */

      case "#":

        changeZoom(1);

        break;


      /*
        1 = home
      */

      case "1":

        goHome();

        break;


      /*
        2 = search
      */

      case "2":

        address.focus();

        showToast(
          "SEARCH / URL"
        );

        break;


      /*
        3 = desktop
      */

      case "3":

        setDesktop();

        break;


      /*
        4 = mobile
      */

      case "4":

        setMobile();

        break;


      /*
        5 = tools
      */

      case "5":

        openTools();

        break;


      /*
        6 = bookmark
      */

      case "6":

        saveBookmark();

        break;


      /*
        7 = history
      */

      case "7":

        showHistory();

        break;


      /*
        8 = reload
      */

      case "8":

        reloadPage();

        break;


      /*
        9 = address/search
      */

      case "9":

        address.focus();

        break;

    }

  }
);


/* =====================================================
   ADDRESS
===================================================== */

address.addEventListener(
  "keydown",
  function(e){

    if(
      e.key === "Enter"
    ){

      navigate();

    }

  }
);


/* =====================================================
   BOOKMARK
===================================================== */

function saveBookmark(){

  const url =
    address.value.trim();

  if(!url){

    showToast(
      "Nothing to save"
    );

    return;

  }


  if(
    !bookmarks.includes(url)
  ){

    bookmarks.unshift(url);

    localStorage.setItem(
      "r60_bookmarks",
      JSON.stringify(
        bookmarks
      )
    );

    showToast(
      "BOOKMARK SAVED"
    );

  }else{

    showToast(
      "ALREADY SAVED"
    );

  }

}


/* =====================================================
   HISTORY
===================================================== */

function addHistory(url){

  historyList =
    historyList.filter(
      x => x !== url
    );

  historyList.unshift(url);

  historyList =
    historyList.slice(
      0,
      50
    );

  localStorage.setItem(
    "r60_history",
    JSON.stringify(
      historyList
    )
  );

}

/* =====================================================
   BOOKMARK LIST
===================================================== */

function showBookmarks(){

  panel.innerHTML = `

    <div class="panel-head">

      BOOKMARKS

      <button
        class="close"
        onclick="closePanel()">
        X
      </button>

    </div>

  `;


  if(!bookmarks.length){

    panel.innerHTML +=
      "<p>No bookmarks.</p>";

  }


  bookmarks.forEach(
    (url,index)=>{

      const row =
        document.createElement(
          "div"
        );

      row.className =
        "panel-item";


      const open =
        document.createElement(
          "button"
        );

      open.textContent =
        url;

      open.onclick =
        ()=>{
          address.value =
            url;

          loadURL(url);

          closePanel();

        };


      const del =
        document.createElement(
          "button"
        );

      del.textContent =
        "X";

      del.style.flex =
        "0 0 42px";

      del.style.background =
        "var(--red)";

      del.onclick =
        ()=>{

          bookmarks.splice(
            index,
            1
          );

          localStorage.setItem(
            "r60_bookmarks",
            JSON.stringify(
              bookmarks
            )
          );

          showBookmarks();

        };


      row.appendChild(
        open
      );

      row.appendChild(
        del
      );

      panel.appendChild(
        row
      );

    }
  );

}


/* =====================================================
   HISTORY
===================================================== */

function showHistory(){

  panel.innerHTML = `

    <div class="panel-head">

      HISTORY

      <button
        class="close"
        onclick="closePanel()">
        X
      </button>

    </div>

  `;


  if(!historyList.length){

    panel.innerHTML +=
      "<p>No history.</p>";

  }


  historyList.forEach(
    url=>{

      const button =
        document.createElement(
          "button"
        );

      button.textContent =
        url;

      button.style.width =
        "100%";

      button.style.margin =
        "3px 0";

      button.style.minHeight =
        "36px";

      button.style.background =
        "#1b2937";

      button.style.color =
        "white";

      button.style.border =
        "1px solid #304153";

      button.style.borderRadius =
        "8px";

      button.onclick =
        ()=>{

          address.value =
            url;

          loadURL(url);

          closePanel();

        };

      panel.appendChild(
        button
      );

    }
  );


  panel.style.display =
    "block";

}


/* =====================================================
   CLOSE PANEL
===================================================== */

function closePanel(){

  panel.style.display =
    "none";

}


/* =====================================================
   TOAST
===================================================== */

let toastTimer;

function showToast(text){

  toast.textContent =
    text;

  toast.style.display =
    "block";

  clearTimeout(
    toastTimer
  );

  toastTimer =
    setTimeout(
      ()=>{
        toast.style.display =
          "none";
      },
      1200
    );

}


/* =====================================================
   INITIALIZE
===================================================== */

applyMode();

resetZoom();

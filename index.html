<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1,
               maximum-scale=1,
               user-scalable=no">

<title>R60 Browser</title>

<style>

:root{
  --bg:#070a0f;
  --panel:#101722;
  --panel2:#182230;
  --border:#29384b;
  --text:#fff;
  --muted:#8391a4;
  --blue:#2388ff;
  --blue2:#1267ca;
  --purple:#7547d8;
  --green:#149765;
  --orange:#c77b18;
  --red:#b73b4b;
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,
body{
  width:100%;
  height:100%;
  margin:0;
  overflow:hidden;
  background:var(--bg);
  color:var(--text);
  font-family:Arial,sans-serif;
}

body{
  user-select:none;
}

button,
input{
  font-family:Arial,sans-serif;
}

/* =========================
   APP
========================= */

#app{
  width:100%;
  height:100%;
  display:flex;
  flex-direction:column;
}

/* =========================
   TOP
========================= */

.top{
  background:
    linear-gradient(
      180deg,
      #151e2a,
      #0e141d
    );

  border-bottom:1px solid var(--border);

  padding:6px;

  box-shadow:
    0 2px 12px rgba(0,0,0,.45);
}

/* =========================
   ADDRESS
========================= */

.addressRow{
  display:flex;
  gap:5px;
}

#address{
  flex:1;
  min-width:0;

  height:40px;

  background:#070b11;

  border:1px solid #304158;

  border-radius:11px;

  color:white;

  padding:0 11px;

  font-size:13px;

  outline:none;
}

#address:focus{
  border-color:var(--blue);
  box-shadow:
    0 0 0 2px
    rgba(35,136,255,.15);
}

.go{
  width:52px;

  border:0;
  border-radius:10px;

  background:
    linear-gradient(
      180deg,
      #3195ff,
      #1267c9
    );

  color:white;

  font-weight:bold;
}

/* =========================
   NAVIGATION
========================= */

.nav{
  display:grid;

  grid-template-columns:
  repeat(7,1fr);

  gap:4px;

  margin-top:5px;
}

.nav button{
  min-height:34px;

  border:1px solid #2b3848;

  border-radius:8px;

  color:#eaf1fa;

  background:
    linear-gradient(
      180deg,
      #202c3a,
      #161f2b
    );

  font-size:15px;
}

.nav button:active{
  transform:scale(.91);
}

/* =========================
   MODE
========================= */

.modes{
  display:grid;

  grid-template-columns:
  1fr 1fr 1fr;

  gap:4px;

  margin-top:5px;
}

.modes button{
  min-height:34px;

  border-radius:8px;

  font-size:11px;

  font-weight:bold;
}

.desktop{
  background:
    linear-gradient(
      180deg,
      #8955ec,
      #5a31aa
    );
}

.mobile{
  background:
    linear-gradient(
      180deg,
      #1bb97b,
      #08734b
    );
}

.realBrowser{
  background:
    linear-gradient(
      180deg,
      #d99127,
      #92580c
    );
}

.active{
  box-shadow:
    inset 0 0 0 2px white,
    0 0 10px rgba(255,255,255,.12);
}

/* =========================
   WEB AREA
========================= */

#webArea{
  flex:1;

  position:relative;

  overflow:hidden;

  background:#05070a;
}

#home{
  position:absolute;

  inset:0;

  overflow:auto;

  padding:20px 12px;
}

/* =========================
   BRAND
========================= */

.brand{
  text-align:center;

  margin-top:22px;

  font-size:29px;

  font-weight:900;

  letter-spacing:.5px;

  background:
    linear-gradient(
      90deg,
      #5caaff,
      #b67aff
    );

  -webkit-background-clip:text;
  color:transparent;
}

.tagline{
  text-align:center;

  margin-top:5px;

  color:var(--muted);

  font-size:11px;
}

/* =========================
   QUICK
========================= */

.title{
  margin-top:23px;

  color:#aebbd0;

  font-size:11px;

  font-weight:bold;

  letter-spacing:1px;
}

.quick{
  display:grid;

  grid-template-columns:
  repeat(3,1fr);

  gap:7px;

  margin-top:7px;
}

.quick button{
  min-height:51px;

  border:1px solid #2a394b;

  border-radius:10px;

  background:
    linear-gradient(
      180deg,
      #1b2635,
      #121a24
    );

  color:white;

  font-weight:bold;

  font-size:10px;

  transition:
    transform .08s,
    background .15s;
}

.quick button:active{
  transform:scale(.94);

  background:#253b56;
}

/* =========================
   IFRAME
========================= */

#web{
  display:none;

  position:absolute;

  left:0;
  top:0;

  border:0;

  background:white;

  width:100%;
  height:100%;
}

/*
 Desktop simulation
*/

.desktopCanvas{
  width:1366px !important;

  height:100% !important;

  transform-origin:
    top left;
}

/* =========================
   CURSOR
========================= */

#cursor{
  position:absolute;

  width:17px;
  height:17px;

  z-index:20;

  pointer-events:none;

  display:none;

  border-radius:50%;

  border:2px solid white;

  background:
    rgba(35,136,255,.45);

  box-shadow:
    0 0 0 2px
    rgba(0,0,0,.7),
    0 0 10px
    rgba(35,136,255,.8);

  transition:
    left .035s linear,
    top .035s linear;
}

.cursorClick{
  animation:
    clickPulse .18s ease;
}

@keyframes clickPulse{

  0%{
    transform:scale(1);
  }

  50%{
    transform:scale(1.8);
  }

  100%{
    transform:scale(1);
  }

}

/* =========================
   STATUS
========================= */

#toast{
  position:absolute;

  z-index:100;

  left:50%;

  bottom:14px;

  transform:
    translateX(-50%);

  padding:8px 13px;

  background:
    rgba(0,0,0,.86);

  border:
    1px solid #4a596c;

  border-radius:20px;

  font-size:11px;

  display:none;

  white-space:nowrap;
}

/* =========================
   PANEL
========================= */

#panel{
  position:absolute;

  z-index:200;

  left:5px;
  right:5px;
  bottom:5px;

  max-height:82%;

  overflow:auto;

  display:none;

  background:
    linear-gradient(
      180deg,
      #141d29,
      #0e141c
    );

  border:
    1px solid #3a4a60;

  border-radius:13px;

  padding:8px;

  box-shadow:
    0 15px 45px
    rgba(0,0,0,.8);
}

.panelHead{
  display:flex;

  justify-content:
    space-between;

  align-items:center;

  padding:5px;

  margin-bottom:6px;

  border-bottom:
    1px solid var(--border);

  font-weight:bold;
}

.panelItem{
  display:flex;

  gap:5px;

  margin:5px 0;
}

.panelItem button{
  flex:1;

  min-height:38px;

  border-radius:8px;

  padding:0 9px;

  color:white;

  background:#1d2938;

  border:1px solid #2e3d50;

  text-align:left;
}

.close{
  background:var(--red)!important;
}

/* =========================
   BOTTOM
========================= */

.bottom{
  display:grid;

  grid-template-columns:
  repeat(5,1fr);

  gap:4px;

  padding:5px;

  background:#101721;

  border-top:
    1px solid var(--border);
}

.bottom button{
  min-height:34px;

  border-radius:8px;

  color:#dce8f7;

  background:#1b2634;

  border:1px solid #2b3a4c;

  font-size:10px;

  font-weight:bold;
}

/* =========================
   POINTER MODE INDICATOR
========================= */

.pointerInfo{
  position:absolute;

  top:8px;
  right:8px;

  z-index:25;

  padding:5px 8px;

  border-radius:15px;

  background:
    rgba(0,0,0,.7);

  color:#aebbd0;

  font-size:9px;

  display:none;
}

</style>
</head>

<body>

<div id="app">

  <!-- TOP -->
  <div class="top">

    <div class="addressRow">

      <input
        id="address"
        placeholder="Search Google or enter URL"
        autocomplete="off"
        spellcheck="false"
        inputmode="url">

      <button
        class="go"
        onclick="navigate()">
        GO
      </button>

    </div>


    <div class="nav">

      <button onclick="back()">◀</button>
      <button onclick="forward()">▶</button>
      <button onclick="reload()">↻</button>
      <button onclick="home()">⌂</button>
      <button onclick="newTab()">＋</button>
      <button onclick="bookmark()">★</button>
      <button onclick="settings()">⚙</button>

    </div>


    <div class="modes">

      <button
        id="desktopBtn"
        class="desktop"
        onclick="desktopMode()">
        🖥 DESKTOP
      </button>

      <button
        id="mobileBtn"
        class="mobile"
        onclick="mobileMode()">
        📱 MOBILE
      </button>

      <button
        class="realBrowser"
        onclick="realBrowser()">
        🌐 BROWSER
      </button>

    </div>

  </div>


  <!-- WEB AREA -->

  <div id="webArea">

    <!-- HOME -->

    <div id="home">

      <div class="brand">
        R60 Browser
      </div>

      <div class="tagline">
        Lightweight • Keypad • Desktop View
      </div>


      <div class="title">
        QUICK ACCESS
      </div>

      <div class="quick">

        <button
          onclick="openURL('https://www.google.com')">
          Google
        </button>

        <button
          onclick="openURL('https://www.youtube.com')">
          YouTube
        </button>

        <button
          onclick="openURL('https://web.imo.im')">
          imo Web
        </button>

        <button
          onclick="openURL('https://www.facebook.com')">
          Facebook
        </button>

        <button
          onclick="openURL('https://github.com')">
          GitHub
        </button>

        <button
          onclick="openURL('https://wikipedia.org')">
          Wikipedia
        </button>

      </div>


      <div class="title">
        SEARCH
      </div>

      <div class="quick">

        <button
          onclick="searchGoogle('YouTube')">
          YouTube Search
        </button>

        <button
          onclick="searchGoogle('Facebook')">
          Facebook Search
        </button>

        <button
          onclick="searchGoogle('imo web login')">
          imo Search
        </button>

      </div>


      <div class="title">
        KEYPAD
      </div>

      <div class="quick">

        <button>↑ ↓</button>
        <button>← →</button>
        <button>OK = CLICK</button>

      </div>

    </div>


    <!-- WEBSITE -->

    <iframe
      id="web"
      allow="
        fullscreen;
        autoplay;
        microphone;
        camera
      "
      referrerpolicy=
      "strict-origin-when-cross-origin">
    </iframe>


    <!-- CURSOR -->

    <div id="cursor"></div>

    <div
      id="pointerInfo">
      POINTER
    </div>


    <!-- TOAST -->

    <div id="toast"></div>


    <!-- PANEL -->

    <div id="panel"></div>

  </div>


  <!-- BOTTOM -->

  <div class="bottom">

    <button onclick="zoom(-1)">
      − ZOOM
    </button>

    <button onclick="zoom(0)">
      100%
    </button>

    <button onclick="zoom(1)">
      + ZOOM
    </button>

    <button onclick="fullscreen()">
      ⛶ FULL
    </button>

    <button onclick="tools()">
      TOOLS
    </button>

  </div>

</div>


<script>

/* =====================================
   STATE
===================================== */

let mode =
  localStorage.getItem("mode")
  || "desktop";

let scale =
  Number(
    localStorage.getItem("scale")
    || 1
  );

let cursorX = 50;
let cursorY = 50;

let cursorSpeed = 30;

let bookmarks =
  JSON.parse(
    localStorage.getItem(
      "bookmarks"
    ) || "[]"
  );

let history =
  JSON.parse(
    localStorage.getItem(
      "history"
    ) || "[]"
  );


/* =====================================
   ELEMENTS
===================================== */

const address =
  document.getElementById(
    "address"
  );

const web =
  document.getElementById(
    "web"
  );

const homePage =
  document.getElementById(
    "home"
  );

const cursor =
  document.getElementById(
    "cursor"
  );

const toast =
  document.getElementById(
    "toast"
  );

const panel =
  document.getElementById(
    "panel"
  );


/* =====================================
   URL
===================================== */

function isURL(text){

  return (
    /^https?:\/\//i.test(text)
    ||
    /^[\w-]+\.[a-z]{2,}/i
      .test(text)
  );

}


function normalize(text){

  text =
    text.trim();

  if(
    /^https?:\/\//i
      .test(text)
  ){
    return text;
  }

  return "https://" + text;

}


/* =====================================
   NAVIGATE
===================================== */

function navigate(){

  let text =
    address.value.trim();

  if(!text){
    return;
  }

  if(isURL(text)){

    openURL(
      normalize(text)
    );

  }else{

    searchGoogle(text);

  }

}


/* =====================================
   GOOGLE
===================================== */

function searchGoogle(query){

  let url =
    "https://www.google.com/search?q="
    +
    encodeURIComponent(
      query
    );

  address.value =
    url;

  openURL(url);

}


/* =====================================
   OPEN
===================================== */

function openURL(url){

  if(!url){

    navigate();

    return;

  }

  address.value =
    url;

  homePage.style.display =
    "none";

  web.style.display =
    "block";

  applyMode();

  web.src =
    url;

  addHistory(url);

  showToast(
    mode === "desktop"
      ? "Desktop mode"
      : "Mobile mode"
  );

}


/* =====================================
   DESKTOP
===================================== */

function desktopMode(){

  mode =
    "desktop";

  localStorage.setItem(
    "mode",
    mode
  );

  applyMode();

  showToast(
    "🖥 Desktop viewport ON"
  );

}


/* =====================================
   MOBILE
===================================== */

function mobileMode(){

  mode =
    "mobile";

  localStorage.setItem(
    "mode",
    mode
  );

  applyMode();

  showToast(
    "📱 Mobile viewport ON"
  );

}


/* =====================================
   APPLY MODE
===================================== */

function applyMode(){

  const d =
    document.getElementById(
      "desktopBtn"
    );

  const m =
    document.getElementById(
      "mobileBtn"
    );


  d.classList.toggle(
    "active",
    mode === "desktop"
  );

  m.classList.toggle(
    "active",
    mode === "mobile"
  );


  if(mode === "desktop"){

    web.classList.add(
      "desktopCanvas"
    );

  }else{

    web.classList.remove(
      "desktopCanvas"
    );

  }


  /*
    Cursor becomes available when
    a webpage is loaded.
  */

  if(
    web.style.display !== "none"
  ){

    cursor.style.display =
      "block";

  }

}


/* =====================================
   REAL BROWSER
===================================== */

function realBrowser(){

  let text =
    address.value.trim();

  if(!text){

    showToast(
      "Enter URL or search"
    );

    return;

  }

  let url;

  if(isURL(text)){

    url =
      normalize(text);

  }else{

    url =
      "https://www.google.com/search?q="
      +
      encodeURIComponent(text);

  }


  window.open(
    url,
    "_blank"
  );

}


/* =====================================
   BACK
===================================== */

function back(){

  try{

    web.contentWindow
      .history
      .back();

  }catch(e){

    realBrowser();

  }

}


/* =====================================
   FORWARD
===================================== */

function forward(){

  try{

    web.contentWindow
      .history
      .forward();

  }catch(e){

    realBrowser();

  }

}


/* =====================================
   RELOAD
===================================== */

function reload(){

  try{

    web.contentWindow
      .location
      .reload();

  }catch(e){

    web.src =
      web.src;

  }

}


/* =====================================
   HOME
===================================== */

function home(){

  web.style.display =
    "none";

  cursor.style.display =
    "none";

  homePage.style.display =
    "block";

  address.value =
    "";

}


/* =====================================
   NEW TAB
===================================== */

function newTab(){

  window.open(
    "https://www.google.com",
    "_blank"
  );

}


/* =====================================
   BOOKMARK
===================================== */

function bookmark(){

  let url =
    address.value.trim();

  if(!url){

    showToast(
      "Nothing to save"
    );

    return;

  }


  if(
    !bookmarks.includes(url)
  ){

    bookmarks.unshift(url);

    localStorage.setItem(
      "bookmarks",
      JSON.stringify(
        bookmarks
      )
    );

    showToast(
      "★ Saved"
    );

  }else{

    showToast(
      "Already saved"
    );

  }

}


/* =====================================
   HISTORY
===================================== */

function addHistory(url){

  history =
    history.filter(
      x => x !== url
    );

  history.unshift(url);

  history =
    history.slice(0,50);

  localStorage.setItem(
    "history",
    JSON.stringify(
      history
    )
  );

}


/* =====================================
   ZOOM
===================================== */

function zoom(dir){

  if(dir === 0){

    scale = 1;

  }else{

    scale +=
      dir * .1;

  }

  scale =
    Math.max(
      .5,
      Math.min(
        2,
        scale
      )
    );

  localStorage.setItem(
    "scale",
    scale
  );


  web.style.transform =
    "scale("
    + scale
    + ")";

  web.style.transformOrigin =
    "top left";

  web.style.width =
    (100 / scale)
    + "%";

  web.style.height =
    (100 / scale)
    + "%";


  showToast(
    Math.round(scale*100)
    + "%"
  );

}


/* =====================================
   FULLSCREEN
===================================== */

function fullscreen(){

  if(
    !document.fullscreenElement
  ){

    document.documentElement
      .requestFullscreen?.();

  }else{

    document
      .exitFullscreen?.();

  }

}


/* =====================================
   TOAST
===================================== */

let toastTimer;

function showToast(text){

  toast.textContent =
    text;

  toast.style.display =
    "block";

  clearTimeout(
    toastTimer
  );

  toastTimer =
    setTimeout(
      ()=>{
        toast.style.display =
          "none";
      },
      1400
    );

}


/* =====================================
   CURSOR
===================================== */

function showCursor(){

  cursor.style.display =
    "block";

  cursor.style.left =
    cursorX + "px";

  cursor.style.top =
    cursorY + "px";

}


/* =====================================
   MOVE CURSOR
===================================== */

function moveCursor(dx,dy){

  cursorX +=
    dx * cursorSpeed;

  cursorY +=
    dy * cursorSpeed;


  const area =
    document.getElementById(
      "webArea"
    );

  cursorX =
    Math.max(
      3,
      Math.min(
        area.clientWidth - 3,
        cursorX
      )
    );

  cursorY =
    Math.max(
      3,
      Math.min(
        area.clientHeight - 3,
        cursorY
      )
    );


  showCursor();

}


/* =====================================
   CLICK CURSOR
===================================== */

function cursorClick(){

  cursor.classList.remove(
    "cursorClick"
  );

  /*
    Force animation restart
  */

  void cursor.offsetWidth;

  cursor.classList.add(
    "cursorClick"
  );


  /*
    IMPORTANT:

    We cannot inject a click into
    a cross-origin iframe.

    We therefore focus the iframe.
    Websites that support keyboard
    navigation can then use Enter.
  */

  try{

    web.focus();

  }catch(e){}


  showToast(
    "OK / ENTER"
  );

}


/* =====================================
   KEYPAD CONTROL
===================================== */

document.addEventListener(
  "keydown",
  function(e){

    /*
      Don't hijack typing.
    */

    if(
      document.activeElement ===
      address
    ){

      if(e.key === "Enter"){

        navigate();

      }

      return;

    }


    switch(e.key){

      case "ArrowUp":

        e.preventDefault();

        moveCursor(
          0,
          -1
        );

        break;


      case "ArrowDown":

        e.preventDefault();

        moveCursor(
          0,
          1
        );

        break;


      case "ArrowLeft":

        e.preventDefault();

        /*
          First useful meaning:
          browser BACK
        */

        back();

        break;


      case "ArrowRight":

        e.preventDefault();

        forward();

        break;


      case "Enter":

      case "OK":

        e.preventDefault();

        cursorClick();

        break;


      case "0":

        fullscreen();

        break;


      case "*":

        zoom(-1);

        break;


      case "#":

        zoom(1);

        break;


      case "1":

        home();

        break;


      case "2":

        searchGoogle(
          "Google"
        );

        break;


      case "3":

        desktopMode();

        break;


      case "4":

        mobileMode();

        break;


      case "5":

        tools();

        break;


      case "6":

        bookmark();

        break;


      case "7":

        showHistory();

        break;


      case "8":

        reload();

        break;


      case "9":

        address.focus();

        showToast(
          "Search / URL"
        );

        break;


      case "Escape":

        closePanel();

        break;

    }

  }
);


/* =====================================
   TOOLS
===================================== */

function tools(){

  panel.innerHTML = `

    <div class="panelHead">

      TOOLS

      <button
        class="close"
        onclick="closePanel()">
        X
      </button>

    </div>

    <div class="panelItem">

      <button
        onclick="zoom(-1)">
        − Zoom
      </button>

      <button
        onclick="zoom(1)">
        + Zoom
      </button>

    </div>

    <div class="panelItem">

      <button
        onclick="zoom(0)">
        Reset 100%
      </button>

      <button
        onclick="fullscreen()">
        Fullscreen
      </button>

    </div>

    <div class="panelItem">

      <button
        onclick="desktopMode()">
        🖥 Desktop
      </button>

      <button
        onclick="mobileMode()">
        📱 Mobile
      </button>

    </div>

    <div class="panelItem">

      <button
        onclick="bookmark()">
        ★ Bookmark
      </button>

    </div>

    <div class="panelItem">

      <button
        onclick="showHistory()">
        🕘 History
      </button>

    </div>

    <div class="panelItem">

      <button
        onclick="realBrowser()">
        🌐 Real Browser
      </button>

    </div>

  `;

  panel.style.display =
    "block";

}


/* =====================================
   SETTINGS
===================================== */

function settings(){

  panel.innerHTML = `

    <div class="panelHead">

      SETTINGS

      <button
        class="close"
        onclick="closePanel()">
        X
      </button>

    </div>

    <div class="panelItem">

      <button
        onclick="
          cursorSpeed=15;
          showToast('Slow');
        ">
        Cursor Slow
      </button>

      <button
        onclick="
          cursorSpeed=30;
          showToast('Normal');
        ">
        Cursor Normal
      </button>

      <button
        onclick="
          cursorSpeed=60;
          showToast('Fast');
        ">
        Cursor Fast
      </button>

    </div>

    <div class="panelItem">

      <button
        onclick="
          desktopMode();
          closePanel();
        ">
        🖥 Desktop Mode
      </button>

    </div>

    <div class="panelItem">

      <button
        onclick="
          mobileMode();
          closePanel();
        ">
        📱 Mobile Mode
      </button>

    </div>

    <div class="panelItem">

      <button
        onclick="showBookmarks()">
        ★ Bookmarks
      </button>

    </div>

    <div class="panelItem">

      <button
        onclick="showHistory()">
        🕘 History
      </button>

    </div>

  `;

  panel.style.display =
    "block";

}


/* =====================================
   BOOKMARK LIST
===================================== */

function showBookmarks(){

  panel.innerHTML = `

    <div class="panelHead">

      BOOKMARKS

      <button
        class="close"
        onclick="closePanel()">
        X
      </button>

    </div>

  `;


  if(!bookmarks.length){

    panel.innerHTML +=
      "<p>No bookmarks.</p>";

  }


  bookmarks.forEach(
    (url,i)=>{

      let row =
        document.createElement(
          "div"
        );

      row.className =
        "panelItem";


      let open =
        document.createElement(
          "button"
        );

      open.textContent =
        url;

      open.onclick =
        ()=>{
          address.value =
            url;

          openURL(url);

          closePanel();
        };


      let del =
        document.createElement(
          "button"
        );

      del.textContent =
        "X";

      del.style.flex =
        "0 0 40px";

      del.style.background =
        "#b73b4b";

      del.onclick =
        ()=>{

          bookmarks.splice(
            i,
            1
          );

          localStorage.setItem(
            "bookmarks",
            JSON.stringify(
              bookmarks
            )
          );

          showBookmarks();

        };


      row.appendChild(
        open
      );

      row.appendChild(
        del
      );

      panel.appendChild(
        row
      );

    }
  );

}


/* =====================================
   HISTORY LIST
===================================== */

function showHistory(){

  panel.innerHTML = `

    <div class="panelHead">

      HISTORY

      <button
        class="close"
        onclick="closePanel()">
        X
      </button>

    </div>

  `;


  history.forEach(
    url=>{

      let btn =
        document.createElement(
          "button"
        );

      btn.textContent =
        url;

      btn.style.width =
        "100%";

      btn.style.margin =
        "3px 0";

      btn.onclick =
        ()=>{

          address.value =
            url;

          openURL(url);

          closePanel();

        };

      panel.appendChild(
        btn
      );

    }
  );

}


/* =====================================
   CLOSE
===================================== */

function closePanel(){

  panel.style.display =
    "none";

}


/* =====================================
   START
===================================== */

applyMode();

zoom(0);

</script>

</body>
</html>
